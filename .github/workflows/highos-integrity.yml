name: High OS • Integridade

on:
  push:
    branches: [main, 'improvement/**', 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe dos módulos críticos
        run: |
          node --check assets/app.js
          node --check assets/mission-planner.js
          node --check assets/modules/blips-sheet-sync.js
          node --check assets/modules/metricas-parser.js
          node --check assets/modules/acoes-core.js
          node --check assets/modules/acoes-sheet-sync.js
          node --check assets/modules/acoes-planejador-ui.js
          node --check assets/modules/metricas-motor.js
          node --check assets/modules/ocupacao.js
      - name: Regressão de dados e transações
        run: node --test tests/*.test.mjs
      - name: Integridade das funções do High OS
        run: node tools/verificar-integridade.mjs
      - name: Chamadas e funções ausentes
        run: node tools/verificar-chamadas.mjs
      - name: Cobertura das regras do Firestore
        run: node tools/verificar-regras.mjs
