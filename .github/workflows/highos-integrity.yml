name: High OS • Integridade

on:
  push:
    branches: [main, 'improvement/**', 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o conferidor de versoes compara com a main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Versões de cache dos assets alterados
        # Um arquivo alterado cujo ?v= não sobe segue sendo servido do
        # cache: a correção vai ao ar e a tela continua quebrada.
        run: |
          git fetch origin main --depth=50 || true
          node tools/versoes.mjs origin/main
      - name: Sintaxe dos módulos críticos
        run: |
          # node --check trata .js como script: declaracao duplicada de
          # import ou de let no escopo de modulo NAO e acusada. Ja passou
          # um "import * as metasUi" repetido que derrubou o painel
          # inteiro. Checando como .mjs o Node aplica as regras de modulo.
          set -e
          for f in assets/app.js assets/mission-planner.js assets/modules/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs" || { echo "FALHOU: $f"; exit 1; }
          done
          echo "Sintaxe de módulo OK em $(ls assets/modules/*.js | wc -l) módulos + app.js"
      - name: Regressão de dados e transações
        run: node --test tests/*.test.mjs
      - name: Integridade das funções do High OS
        run: node tools/verificar-integridade.mjs
      - name: Chamadas e funções ausentes
        run: node tools/verificar-chamadas.mjs
      - name: Cobertura das regras do Firestore
        run: node tools/verificar-regras.mjs
