<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>High OS · Diagnóstico das Métricas</title>
<style>
  :root{--bg:#07060b;--panel:#141019;--line:#33283b;--purple:#8d35ff;--text:#f7f4fb;--muted:#a79db6;--ok:#50f5a0;--err:#ff5b76;--warn:#ffcf5c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,Segoe UI,Roboto,sans-serif;padding:24px}
  .wrap{max-width:980px;margin:0 auto}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}
  .card h2{font-size:10.5px;letter-spacing:.12em;margin:0 0 12px;color:#d9c4eb}
  input{width:100%;background:#0a0810;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:11px 13px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
  button{background:var(--purple);color:#fff;border:none;border-radius:9px;padding:11px 17px;font-weight:800;letter-spacing:.05em;cursor:pointer;font-size:11px;margin-top:11px}
  button.sec{background:transparent;border:1px solid var(--line);color:var(--text)}
  pre{background:#0a0810;border:1px solid var(--line);border-radius:10px;padding:13px;font:11.5px/1.65 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:320px;overflow:auto;margin:0}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  th{font-size:9.5px;letter-spacing:.09em;color:var(--muted)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
  .verdict{border-left:3px solid var(--purple);padding:10px 14px;margin-top:12px;font-size:13px;line-height:1.6;background:rgba(141,53,255,.07);border-radius:0 10px 10px 0}
  .verdict.err{border-left-color:var(--err);background:rgba(255,91,118,.08)}
  .verdict.ok{border-left-color:var(--ok);background:rgba(80,245,160,.08)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Diagnóstico da planilha de métricas <span style="font-size:11px;color:#50f5a0;letter-spacing:.1em">v10</span></h1>
  <p class="sub">Lê a planilha publicada exatamente como o High OS lê e mostra o que foi reconhecido.</p>

  <div class="card">
    <h2>URL PUBLICADA</h2>
    <input id="url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pubhtml?gid=...&single=true">
    <button id="run">ANALISAR</button>
    <button id="copy" class="sec">COPIAR RESULTADO</button>
  </div>

  <div class="card">
    <h2>RESULTADO</h2>
    <div id="verdict"></div>
    <div id="tabela"></div>
  </div>

  <div class="card">
    <h2>PRIMEIRAS LINHAS DO CSV</h2>
    <pre id="bruto">—</pre>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const URL_PADRAO='https://docs.google.com/spreadsheets/d/e/2PACX-1vTAKi2m0rqOMHp8Tdn2JU8NglHG6DhqUeG_criSCd_gZsdTRAkDP560FRcMHnM5adryPBZEIbxVCfCT/pubhtml?gid=156598669&single=true';
$('#url').value=URL_PADRAO;

/* mesma conversão que o app faz */
function csvUrl(value){
  try{
    const u=new window.URL(String(value||'').trim());
    const gid=u.searchParams.get('gid')||'';
    u.pathname=u.pathname.replace(/\/(pubhtml|pub|edit)\/?$/,'/pub');
    const q=new URLSearchParams();
    if(gid)q.set('gid',gid);
    q.set('single','true');q.set('output','csv');q.set('_',String(Date.now()));
    u.search=q.toString();
    return u.toString();
  }catch(e){return String(value||'')}
}
function parseCsvRows(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(cell);cell=''}
    else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}
    else cell+=c}
  if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}
  return rows;
}
function slotLabel(v){
  const t=String(v||'').trim().toUpperCase().replace(/\s+/g,'');
  if(/^14H?$/.test(t))return '14H';
  if(/^16H?$/.test(t))return '16H';
  if(/^21H?$/.test(t))return '21H';
  if(/^23H?$/.test(t))return '23H';
  return '';
}
function normalizeDate(v){
  const t=String(v||'').trim();
  if(!t)return '';
  let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  m=t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){let a=m[3];if(a.length===2)a='20'+a;return `${a}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`}
  return '';
}
function fmt(d){try{return new Date(d+'T12:00:00').toLocaleDateString('pt-BR')}catch(e){return d}}


/* ---- replica o mapeamento coluna->data do app, para ver onde os valores caem ---- */
function groupLabel(v){
  const t=String(v||'').trim();
  if(!t)return '';
  if(/^\d+$/.test(t))return '';
  if(/^(14|16|21|23)H?$/i.test(t.replace(/\s+/g,'')))return '';
  if(normalizeDate(t))return '';
  return t.length>=2?t:'';
}
function num(v){
  const t=String(v==null?'':v).trim().replace(/\./g,'').replace(',','.');
  if(!t||!/^-?\d+(\.\d+)?$/.test(t))return null;
  return Number(t);
}
function nearestDateRow(values,headerIndex){
  let best=-1,bestScore=-1;
  for(let i=Math.max(0,headerIndex-12);i<headerIndex;i++){
    const dates=(values[i]||[]).map(normalizeDate).filter(Boolean);
    if(!dates.length)continue;
    const score=dates.length*1000-(headerIndex-i);
    if(score>bestScore){bestScore=score;best=i}
  }
  return best;
}
function buildColumnDateMap(header,dateRow){
  const map={},slotsByCol={},anchors=[];
  for(let c=0;c<(dateRow||[]).length;c++){const d=normalizeDate((dateRow||[])[c]);if(d)anchors.push({c,d})}
  const padrao=['14H','16H','21H','23H'];
  for(let i=0;i<anchors.length;i++){const a=anchors[i],next=anchors[i+1]?.c??Infinity;for(let off=0;off<4;off++){const c=a.c+off;if(c>=next)break;map[c]=a.d;slotsByCol[c]=padrao[off]}}
  if(!anchors.length){let dataAtual='';const largura=Math.max((header||[]).length,(dateRow||[]).length);for(let c=0;c<largura;c++){const d=normalizeDate((dateRow||[])[c]);if(d)dataAtual=d;const h=slotLabel((header||[])[c]);if(h&&dataAtual){map[c]=dataAtual;slotsByCol[c]=h}}}
  return {map,slotsByCol};
}
function colapsar(indices){
  const runs=[];
  for(const i of indices){
    if(runs.length&&i-runs[runs.length-1]<=1)runs[runs.length-1]=i;
    else runs.push(i);
  }
  return runs;
}
function extrair(values,cabecalhosBrutos){
  // V10 / 9.7.4: mesma estrategia do app — blocos ancorados pela linha de datas.
  const blocks=[];
  for(let r=0;r<Math.min(values.length,600);r++){
    const anchors=[];(values[r]||[]).forEach((v,c)=>{const d=normalizeDate(v);if(d)anchors.push({c,d})});
    if(anchors.length>=7)blocks.push({dateRowIndex:r,anchors});
  }
  const candidates=[];
  for(let b=0;b<blocks.length;b++){
    const block=blocks[b],hi=block.dateRowIndex+1,fim=blocks[b+1]?.dateRowIndex??values.length;
    const header=values[hi]||[], map={},slots={},padrao=['14H','16H','21H','23H'];
    block.anchors.forEach((a,i)=>{const next=block.anchors[i+1]?.c??Infinity;for(let off=0;off<4;off++){const c=a.c+off;if(c>=next)break;map[c]=a.d;slots[c]=slotLabel(header[c])||padrao[off]}});
    const rows=[];
    for(let r=hi+1;r<fim;r++){
      const row=values[r]||[];let group='';for(const cell of row.slice(0,20)){group=groupLabel(cell);if(group)break}if(!group)continue;
      const byDate={};for(const [cs,d] of Object.entries(map)){const c=+cs,n=num(row[c]);if(n===null)continue;(byDate[d]=byDate[d]||{group,data:d,slots:{}}).slots[slots[c]]=n}Object.values(byDate).forEach(x=>rows.push(x));
    }
    candidates.push({dateRowIndex:block.dateRowIndex,rows,populated:rows.reduce((n,x)=>n+Object.values(x.slots).filter(v=>+v>0).length,0)});
  }
  const best=new Map();for(const c of candidates){const d=c.rows[0]?.data;if(!d)continue;const m=d.slice(3),old=best.get(m);if(!old||c.populated>old.populated)best.set(m,c)}
  const out=[],seen=new Set();for(const c of best.values())for(const x of c.rows){const k=groupLabel(x.group)+'|'+x.data;if(seen.has(k))continue;seen.add(k);out.push(x)}return out;
}
let ultimoTexto='';

async function analisar(){
  const alvo=csvUrl($('#url').value);
  $('#verdict').innerHTML='<div class="verdict">Lendo...</div>';
  $('#tabela').innerHTML='';$('#bruto').textContent='—';
  let txt='';
  try{
    const r=await fetch(alvo,{cache:'no-store',credentials:'omit'});
    txt=await r.text();
    if(!r.ok){
      $('#verdict').innerHTML=`<div class="verdict err">HTTP ${r.status}. A publicação pode ter sido desativada ou o link está errado.</div>`;
      return;
    }
  }catch(e){
    $('#verdict').innerHTML=`<div class="verdict err">Não consegui baixar: ${e.message}.<br>Se falar em CORS, a planilha não está publicada na web (compartilhar não basta).</div>`;
    return;
  }

  $('#bruto').textContent=txt.split('\n').slice(0,12).join('\n');

  if(/^\s*<!DOCTYPE|^\s*<html/i.test(txt)){
    $('#verdict').innerHTML='<div class="verdict err">Veio HTML em vez de CSV: a publicação não está ativa de verdade.</div>';
    return;
  }

  const values=parseCsvRows(txt);
  const cabecalhos=[];
  for(let i=0;i<Math.min(values.length,600);i++){
    const labels=(values[i]||[]).map(slotLabel).filter(Boolean);
    if(['14H','16H','21H','23H'].every(h=>new Set(labels).has(h))&&labels.length>=8)cabecalhos.push(i);
  }

  const datas=new Map();
  values.forEach((linha,i)=>{
    (linha||[]).forEach(c=>{const d=normalizeDate(c);if(d)datas.set(d,(datas.get(d)||0)+1)});
  });
  const ordenadas=[...datas.keys()].sort();
  const hoje=new Date();
  const seteDias=new Date(hoje.getTime()-7*864e5).toISOString().slice(0,10);
  const recentes=ordenadas.filter(d=>d>=seteDias);

  let html='';
  html+=`<div class="verdict ${cabecalhos.length?'ok':'err'}">`;
  html+=`Linhas no CSV: <b>${values.length}</b><br>`;
  html+=`Blocos com 14H/16H/21H/23H encontrados: <b>${cabecalhos.length}</b>${cabecalhos.length?` (linhas ${cabecalhos.slice(0,8).join(', ')})`:''}<br>`;
  html+=`Datas reconhecidas: <b>${ordenadas.length}</b>`;
  if(ordenadas.length)html+=` — da mais antiga <b>${fmt(ordenadas[0])}</b> até a mais recente <b>${fmt(ordenadas[ordenadas.length-1])}</b>`;
  html+=`<br>Datas dos últimos 7 dias: <b class="${recentes.length?'ok':'err'}">${recentes.length}</b>`;
  if(recentes.length)html+=` (${recentes.map(fmt).join(', ')})`;
  html+='</div>';

  if(!cabecalhos.length){
    html+='<div class="verdict err">Nenhum bloco no padrão 14H/16H/21H/23H foi encontrado. Provavelmente o link publicado aponta para outra aba — confira o gid.</div>';
  }else if(!recentes.length){
    html+='<div class="verdict warn">Os blocos existem, mas nenhuma data dos últimos 7 dias apareceu. Ou a semana ainda não foi lançada na planilha, ou as datas desta semana estão num formato diferente das antigas (ex.: texto em vez de data).</div>';
  }else{
    html+='<div class="verdict ok">A planilha está sendo lida corretamente e contém dados desta semana. Se o painel não mostra, o problema está no filtro de período da tela de Métricas.</div>';
  }
  $('#verdict').innerHTML=html;

  if(ordenadas.length){
    const ultimas=ordenadas.slice(-14).reverse();
    $('#tabela').innerHTML='<table><thead><tr><th>DATA RECONHECIDA</th><th class="num">OCORRÊNCIAS NA PLANILHA</th></tr></thead><tbody>'+
      ultimas.map(d=>`<tr><td>${fmt(d)} <span style="color:#8a7f99">(${d})</span></td><td class="num">${datas.get(d)}</td></tr>`).join('')+
      '</tbody></table>';
  }


  // ---- raio-x de cada bloco ----
  const runs=colapsar(cabecalhos);
  let tb='<h3 style="font-size:10px;letter-spacing:.11em;color:#d9c4eb;margin:18px 0 6px">RAIO-X DOS BLOCOS</h3>';
  tb+='<table><thead><tr><th>CABEÇALHO</th><th>LINHA DAS DATAS</th><th class="num">DATAS</th><th class="num">LINHAS</th><th class="num">COLS MAP</th><th class="num">DATAS MAP</th><th class="num">REGISTROS</th><th class="num">VALORES&gt;0</th><th>PERÍODO</th></tr></thead><tbody>';
  runs.forEach((hi,bi)=>{
    const fim=runs[bi+1]??values.length;
    const di=nearestDateRow(values,hi);
    const header=values[hi]||[];
    const dateRow=di>=0?(values[di]||[]):[];
    const datas=dateRow.map(normalizeDate).filter(Boolean);
    let linhasDados=0;
    for(let r=hi+1;r<fim;r++){
      const row=values[r]||[];let g='';
      for(const cell of row.slice(0,20)){g=groupLabel(cell);if(g)break}
      if(g)linhasDados++;
    }
    const cm=di>=0?buildColumnDateMap(header,dateRow):{map:{},slotsByCol:{}};
    const mapa=cm.map, slotsMapa=cm.slotsByCol;
    const nCols=Object.keys(mapa).length;
    const nDatas=new Set(Object.values(mapa)).size;
    let registros=0,comValor=0;
    for(let r=hi+1;r<fim;r++){
      const row=values[r]||[];let g='';
      for(const cell of row.slice(0,20)){g=groupLabel(cell);if(g)break}
      if(!g)continue;
      const vistos=new Set();
      for(const c of Object.keys(mapa)){
        const h=slotsMapa[c]||slotLabel(header[c]);if(!h)continue;
        const n=num(row[c]);if(n===null)continue;
        vistos.add(mapa[c]);if(n>0)comValor++;
      }
      registros+=vistos.size;
    }
    tb+=`<tr><td>linha ${hi}</td><td>${di>=0?('linha '+di):'<span class="err">não achou</span>'}</td>`+
        `<td class="num">${datas.length}</td>`+
        `<td class="num ${linhasDados?'':'err'}">${linhasDados}</td>`+
        `<td class="num">${nCols}</td>`+
        `<td class="num ${nDatas>6?'':'err'}">${nDatas}</td>`+
        `<td class="num ${registros?'':'err'}">${registros}</td>`+
        `<td class="num ${comValor?'':'err'}">${comValor}</td>`+
        `<td>${datas.length?fmt(datas[0])+' → '+fmt(datas[datas.length-1]):'—'}</td></tr>`;
  });
  tb+='</tbody></table>';
  $('#tabela').innerHTML+=tb;

  // ---- detalhe do ultimo bloco: como as colunas viram datas ----
  if(runs.length){
    let hi=runs[runs.length-1],melhor=-1;
    runs.forEach(idx=>{
      const f=runs[runs.indexOf(idx)+1]??values.length;
      const d=nearestDateRow(values,idx);if(d<0)return;
      const mp=buildColumnDateMap(values[idx]||[],values[d]||[]).map;
      let v=0;
      for(let r=idx+1;r<f;r++){const row=values[r]||[];
        for(const c of Object.keys(mp)){const n=num(row[c]);if(n!==null&&n>0)v++}}
      if(v>melhor){melhor=v;hi=idx}
    });
    const di=nearestDateRow(values,hi);
    const header=values[hi]||[], dateRow=di>=0?(values[di]||[]):[];
    const cmDet=buildColumnDateMap(header,dateRow),mapa=cmDet.map,slotsDet=cmDet.slotsByCol;
    const cols=Object.keys(mapa).map(Number).sort((a,b)=>a-b);
    const distintas=new Set(Object.values(mapa));
    let td=`<h3 style="font-size:10px;letter-spacing:.11em;color:#d9c4eb;margin:18px 0 6px">MAPA COLUNA → DATA (bloco da linha ${hi})</h3>`;
    td+=`<div class="verdict">Colunas com horário: <b>${cols.length}</b> &nbsp;•&nbsp; datas distintas no mapa: <b>${distintas.size}</b> &nbsp;•&nbsp; datas na linha ${di}: <b>${dateRow.map(normalizeDate).filter(Boolean).length}</b></div>`;
    td+='<pre style="max-height:220px">'+cols.slice(0,60).map(c=>`col ${String(c).padStart(3)} | ${(slotsDet[c]||slotLabel(header[c])||'').padEnd(4)} | ${mapa[c]}`).join('\n')+'</pre>';
    // amostra crua das 3 linhas-chave
    td+=`<h3 style="font-size:10px;letter-spacing:.11em;color:#d9c4eb;margin:14px 0 6px">CÉLULAS CRUAS</h3>`;
    const amostra=(rotulo,arr)=>`<div style="font-size:10px;color:#a79db6;margin-top:6px">${rotulo}</div><pre style="max-height:120px">${(arr||[]).slice(0,40).map((v,i)=>i+':'+String(v).slice(0,14)).join(' | ')}</pre>`;
    td+=amostra(`linha ${di} (datas)`,dateRow);
    td+=amostra(`linha ${hi} (horários)`,header);
    td+=amostra(`linha ${hi+1} (primeira de dados)`,values[hi+1]);
    $('#tabela').innerHTML+=td;
  }

  // ---- o que o app REALMENTE extrairia ----
  const linhas=extrair(values,cabecalhos);
  const porData=new Map();
  linhas.forEach(l=>{
    const e=porData.get(l.data)||{registros:0,valores:0,groups:new Set()};
    e.registros++;e.groups.add(l.group);
    e.valores+=Object.values(l.slots).filter(v=>v>0).length;
    porData.set(l.data,e);
  });
  const datasExtraidas=[...porData.keys()].sort().reverse().slice(0,14);
  let t2='<h3 style="font-size:10px;letter-spacing:.11em;color:#d9c4eb;margin:18px 0 6px">O QUE O SISTEMA EXTRAI DE FATO</h3>';
  if(!datasExtraidas.length){
    t2+='<div class="verdict err">Nenhum registro foi extraído, apesar dos blocos existirem. O mapeamento coluna → data falhou.</div>';
  }else{
    t2+='<table><thead><tr><th>DATA</th><th class="num">GROUPS</th><th class="num">VALORES &gt; 0</th></tr></thead><tbody>'+
      datasExtraidas.map(d=>{const e=porData.get(d);
        const cls=e.valores?'':'err';
        return `<tr><td>${fmt(d)}</td><td class="num">${e.groups.size}</td><td class="num ${cls}">${e.valores}</td></tr>`}).join('')+
      '</tbody></table>';
    const vazias=datasExtraidas.filter(d=>!porData.get(d).valores);
    if(vazias.length)t2+=`<div class="verdict warn">${vazias.length} data(s) recente(s) foram reconhecidas mas vieram <b>sem nenhum valor preenchido</b>: ${vazias.map(fmt).join(', ')}. Isso significa que as colunas existem na planilha, mas as células de contagem estão vazias — ou os números estão em colunas que não são as de 14H/16H/21H/23H daquele bloco.</div>`;
  }
  $('#tabela').innerHTML+=t2;

  ultimoTexto=$('#verdict').innerText+'\n'+$('#tabela').innerText+'\n\nPRIMEIRAS LINHAS:\n'+$('#bruto').textContent;
}

$('#run').addEventListener('click',analisar);
$('#copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(ultimoTexto||'nada analisado ainda');$('#copy').textContent='COPIADO'}
  catch(e){$('#copy').textContent='FALHOU'}
  setTimeout(()=>$('#copy').textContent='COPIAR RESULTADO',1500);
});
analisar();
</script>
</body>
</html>
